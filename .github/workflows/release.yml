# Tests every push and pull request; every push to main also publishes a release.
# Made after the Aegis: Forever Instance Journal's own.
#
# The release is named after the TOC's ## Version (v0.2.0, say), with the addon zip and that
# version's CHANGELOG entry as its notes. A push that keeps the same version refreshes that
# release's zip and notes, so its download is always the latest push (merged player data
# included). Bump the version (and add a CHANGELOG entry) for a new release. Each new version
# is also uploaded to CurseForge, once, when the CF_API_KEY secret is set; the project id is
# the TOC's ## X-Curse-Project-ID (a CURSEFORGE_PROJECT_ID variable or secret overrides it).
# "Run workflow" on the Actions tab uploads the current version if it isn't there yet.
# Each new version's changelog is also posted to Discord, once, when the DISCORD_WEBHOOK_URL
# secret is set (Tools/discord_post.py).
#
# Nothing here runs for a branch other than main: a release only follows a merge.

name: Test and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test tools
        run: pip install lupa==2.8

      - name: Run the tests
        run: |
          python Tools/smoke_test.py
          python Tools/test_ingest.py
          python Tools/test_release.py

      - name: Build the release zip
        id: build
        run: python Tools/package.py dist

      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
            echo "Refreshed $TAG with this push."
          else
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
              --title "Aegis: Pathfinder (Forever) $TAG" --notes-file dist/notes.md
            echo "Published $TAG."
          fi

      # Each version goes to CurseForge once: the release keeps a curseforge.txt once uploaded.
      # Needs the CF_API_KEY secret; the project id is in the TOC (Tools/curseforge_upload.py).
      - name: Upload to CurseForge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # A variable, or a secret if it was saved as one.
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS || secrets.CURSEFORGE_GAME_VERSION_IDS }}
          CURSEFORGE_RELEASE_TYPE: ${{ vars.CURSEFORGE_RELEASE_TYPE || secrets.CURSEFORGE_RELEASE_TYPE }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx curseforge.txt; then
            echo "$TAG is on CurseForge already."
          else
            python Tools/curseforge_upload.py dist
            if [ -f dist/curseforge.txt ]; then gh release upload "$TAG" dist/curseforge.txt --clobber; fi
          fi

      # Each new version's changelog goes to Discord once: the release keeps a discord.txt once posted.
      # Needs the DISCORD_WEBHOOK_URL secret (Tools/discord_post.py); without it, nothing is posted.
      - name: Post the changelog to Discord
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
          DISCORD_PING_ROLE_ID: ${{ vars.DISCORD_PING_ROLE_ID }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.build.outputs.version }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx discord.txt; then
            echo "$TAG is on Discord already."
          else
            python Tools/discord_post.py dist
            if [ -f dist/discord.txt ]; then gh release upload "$TAG" dist/discord.txt --clobber; fi
          fi
